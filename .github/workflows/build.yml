name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          ECHO_KEYSTORE_BASE64: ${{ secrets.ECHO_KEYSTORE_BASE64 }}
          ECHO_STORE_PASSWORD: ${{ secrets.ECHO_STORE_PASSWORD }}
          ECHO_KEY_ALIAS: ${{ secrets.ECHO_KEY_ALIAS }}
          ECHO_KEY_PASSWORD: ${{ secrets.ECHO_KEY_PASSWORD }}
        run: |
          if [ -n "$ECHO_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$ECHO_KEYSTORE_BASE64" | base64 -d > keystore/release.jks
            mkdir -p ~/.gradle
            {
              echo "ECHO_STORE_FILE=$GITHUB_WORKSPACE/keystore/release.jks"
              echo "ECHO_STORE_PASSWORD=$ECHO_STORE_PASSWORD"
              echo "ECHO_KEY_ALIAS=$ECHO_KEY_ALIAS"
              echo "ECHO_KEY_PASSWORD=$ECHO_KEY_PASSWORD"
            } >> ~/.gradle/gradle.properties
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No release keystore secrets; building with debug signing"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Rename APK
        id: apk
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then VER="${GITHUB_REF_NAME}"; else VER="dev-${GITHUB_SHA::7}"; fi
          SRC=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          DEST="Echo-${VER}.apk"
          cp "$SRC" "$DEST"
          echo "file=$DEST" >> "$GITHUB_OUTPUT"
          ls -la "$DEST"

      - name: Verify APK signature
        if: env.SIGNED == 'true'
        env:
          # SHA-256 of the release keystore (alias echo). Every release must match, or installs can't upgrade.
          EXPECTED_CERT_SHA256: ae1ae1bc6f1e51bf6cb025ec951f41acbb57a22aa6a60845cb4b2f3f325012af
        run: |
          # build-tools/* can match several versions; use the newest explicitly.
          BT=$(ls -1d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          echo "apksigner from $BT"
          OUT=$("${BT}apksigner" verify --verbose --print-certs "${{ steps.apk.outputs.file }}")
          echo "$OUT" | grep -viE "public key|MD5|SHA-1" | head -n 20
          # Output format varies between build-tools releases; compare on lower-case hex without colons.
          echo "$OUT" | tr 'A-F' 'a-f' | tr -d ':' | grep -q "${EXPECTED_CERT_SHA256}" \
            || { echo "::error::APK is not signed with the release certificate"; exit 1; }
          echo "Release certificate OK"

      - name: APK size
        run: |
          echo "APK size: $(stat -c %s "${{ steps.apk.outputs.file }}") bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.file }}
          name: 回响 ${{ github.ref_name }}
          generate_release_notes: true

  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests + Roborazzi screenshots
        run: |
          chmod +x gradlew
          ./gradlew :app:recordRoborazziDebug --stacktrace --no-daemon

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/outputs/roborazzi/*.png
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
